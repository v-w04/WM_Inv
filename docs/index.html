<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Walmart WFS Dashboard — Electronics MX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- Pantalla de login -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">📦</div>
    <h1>Walmart WFS Dashboard</h1>
    <p class="subtitle">Electronics México</p>
    <form id="loginForm">
      <label>
        <span>Contraseña</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="rememberMe" checked>
        Recordar en este navegador
      </label>
      <button type="submit" class="primary" id="loginBtn">Entrar</button>
      <div id="loginMsg" class="msg"></div>
    </form>
    <p class="footnote">La sesión dura 12 horas. Tus credenciales de Walmart nunca salen del backend.</p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" hidden>
  <header>
    <div>
      <h1>Walmart WFS Dashboard</h1>
      <div class="meta">Electronics México · <span id="marketLabel">MX</span></div>
    </div>
    <div class="meta">
      <span class="pill" id="rowCount">0 SKUs</span>
      <span class="pill" id="lastSync">—</span>
      <button class="btn-ghost" id="btnLogout">Salir</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="row">
        <input type="text" id="globalSearch" placeholder="🔍 Buscar en toda la tabla…">
        <button id="btnRefresh" class="primary">↻ Refrescar</button>
        <button id="btnCols">▤ Columnas</button>
        <button id="btnExportXlsx">⬇ XLSX</button>
        <button id="btnExportCsv">⬇ CSV</button>
        <button id="btnExportPdf">⬇ PDF</button>
        <button id="btnClearFilters">✕ Limpiar filtros</button>
        <div class="spacer"></div>
        <label class="auto-label">Auto:
          <select id="autoInterval">
            <option value="0">off</option>
            <option value="60">1 min</option>
            <option value="300">5 min</option>
            <option value="600" selected>10 min</option>
            <option value="1800">30 min</option>
          </select>
        </label>
      </div>
    </div>

    <div class="cols-panel" id="colsPanel" hidden>
      <div class="cols-header">
        <strong>Mostrar columnas</strong>
        <button class="btn-mini" onclick="toggleAllCols(true)">Todas</button>
        <button class="btn-mini" onclick="toggleAllCols(false)">Ninguna</button>
        <div class="spacer"></div>
        <button class="btn-mini" onclick="document.getElementById('colsPanel').hidden = true">Cerrar</button>
      </div>
      <div class="cols-grid" id="colsGrid"></div>
    </div>

    <div class="table-wrap">
      <div class="empty" id="emptyState"><span class="spinner"></span> Cargando inventario…</div>
      <table id="tbl" hidden>
        <thead>
          <tr id="theadCols"></tr>
          <tr class="filter-row" id="theadFilters"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Librerías externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

<!-- Config y app -->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
